  <text x="64" y="250" fill="#e8f2ff" font-size="66" font-weight="700" font-family="Arial, Helvetica, sans-serif">More of your day.</text>
  <text x="67" y="305" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Theme park planning and research, powered by observations.</text>
  <text x="67" y="337" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Find an opening advantage. Keep a good backup. Go enjoy the park.</text>
