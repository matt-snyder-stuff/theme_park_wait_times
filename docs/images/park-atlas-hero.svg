  <path d="M 91 542 L 166 542 L 208 522 L 270 532 L 370 511" fill="none" stroke="#57e1c5" stroke-width="3" />
  <rect x="451" y="405" width="350" height="172" rx="18" fill="#162738" stroke="#35536b" />
  <text x="477" y="445" fill="#ffbd69" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">02 / COMPARE</text>
  <text x="477" y="493" fill="#e8f2ff" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">Learn from complete days</text>
  <path d="M 478 542 L 553 542 L 595 522 L 657 532 L 757 511" fill="none" stroke="#57e1c5" stroke-width="3" />
  <rect x="838" y="405" width="350" height="172" rx="18" fill="#162738" stroke="#35536b" />
