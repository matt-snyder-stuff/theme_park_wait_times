<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>Park Atlas — less waiting, more of your day</title>
  <desc>Original editorial illustration of a theme-park research app. Not a product screenshot.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#152e44" />
      <stop offset="100%" stop-color="#09111d" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#night)" />
  <text x="64" y="78" fill="#57e1c5" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">PARK ATLAS</text>
