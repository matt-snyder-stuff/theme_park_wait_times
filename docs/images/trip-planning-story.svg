<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>A flexible two-park plan</title>
  <desc>Concept illustration with fictional ride examples; not a screenshot or actual recommendation.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#152e44" />
      <stop offset="100%" stop-color="#09111d" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" rx="28" fill="url(#night)" />
  <text x="64" y="70" fill="#57e1c5" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">MY TRIP / TWO PARKS / ONE FLEXIBLE DAY</text>
  <text x="64" y="136" fill="#e8f2ff" font-size="46" font-weight="700" font-family="Arial, Helvetica, sans-serif">Give your morning a purpose.</text>
  <rect x="64" y="185" width="552" height="390" rx="18" fill="#162738" stroke="#35536b" />
  <text x="92" y="227" fill="#ffbd69" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">FIRST PARK</text>
  <rect x="664" y="185" width="552" height="390" rx="18" fill="#162738" stroke="#35536b" />
  <text x="692" y="227" fill="#ffbd69" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif">SECOND PARK</text>
  <text x="92" y="278" fill="#e8f2ff" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Opening priority</text>
  <text x="92" y="316" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Summit Coaster · a fictional example</text>
  <text x="92" y="350" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Compare early waits, later waits and daily variation.</text>
  <text x="92" y="410" fill="#e8f2ff" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Backup you would actually enjoy</text>
  <text x="92" y="448" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">River Voyage · if the first ride is unavailable</text>
  <text x="92" y="502" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Confirm entry time and ride eligibility.</text>
  <text x="92" y="534" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Keep meals and must-dos in the brief.</text>
  <text x="692" y="278" fill="#e8f2ff" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">Arrive with realistic expectations</text>
  <text x="692" y="316" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Include travel time before choosing a window.</text>
  <text x="692" y="350" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Compare matched weekdays, not a single snapshot.</text>
  <text x="692" y="410" fill="#e8f2ff" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">Keep the afternoon flexible</text>
  <text x="692" y="448" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Use live conditions to choose the next queue.</text>
  <text x="692" y="502" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Save locally • Export JSON • Print a brief</text>
  <text x="692" y="534" fill="#acbfd2" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">No booking or walking-route optimization implied.</text>
  <text x="64" y="638" fill="#57e1c5" font-size="26" font-weight="700" font-family="Arial, Helvetica, sans-serif">A shortlist is useful. A false promise of perfect timing is not.</text>
  <text x="64" y="685" fill="#a8bed1" font-size="13" font-weight="400" font-family="Arial, Helvetica, sans-serif">Concept illustration • fictional ride examples • not a dashboard screenshot</text>
</svg>