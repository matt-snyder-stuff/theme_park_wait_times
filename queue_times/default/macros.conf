[queue_times_index]
definition = index=queue_times
iseval = 0

[queue_times_observed_day]
definition = eval open=if(is_open="true",1,0) | where isnotnull(park_local_date) | eventstats min(open) as ride_min_open max(open) as ride_max_open by park_id ride_id park_local_date | eval hours_anchor=if(open=1 AND ride_min_open=0 AND ride_max_open=1,1,0) | eventstats min(eval(if(hours_anchor=1,_time,null()))) as first_open max(eval(if(hours_anchor=1,_time,null()))) as last_open min(_time) as first_sample max(_time) as last_sample by park_id park_local_date | eval complete_day=if(park_day_end<now() AND first_sample<=first_open-240 AND last_sample>=last_open+240 AND last_open-first_open>=7200,1,0)
iseval = 0

[queue_times_outage_segments]
definition = `queue_times_observed_day` | where _time>=first_open AND _time<=last_open | sort 0 park_id ride_id _time | dedup park_id ride_id _time | streamstats current=f last(open) as prev_open last(_time) as prev_time last(park_local_date) as prev_date by park_id ride_id | eval new_segment=if(isnull(prev_open) OR open!=prev_open OR _time-prev_time>900 OR park_local_date!=prev_date,1,0) | streamstats sum(new_segment) as segment by park_id ride_id | stats min(_time) as start max(_time) as finish first(open) as state first(prev_open) as prior_state first(prev_time) as prior_time first(prev_date) as prior_date first(park_local_date) as local_date first(park_local_hour) as start_hour first(park_local_time) as local_start count as samples by park_id park_name ride_id ride_name segment | sort 0 park_id ride_id - start | streamstats current=f last(start) as next_start last(state) as next_state last(local_date) as next_date by park_id ride_id | where state=0 | eval bounded=if(prior_state=1 AND start-prior_time<=900 AND prior_date=local_date AND next_state=1 AND next_start-finish<=900 AND next_date=local_date,1,0), observed_minutes=round((finish-start)/60,1), duration_minutes=if(bounded=1,round((next_start-start)/60,1),null()), transition_uncertainty_minutes=if(bounded=1,round(((start-prior_time)+(next_start-finish))/60,1),null()), episode_status=if(bounded=1,"Completed","Incomplete / gap / boundary")
iseval = 0
