name: Validate app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check queue_times/appserver/static/trip.js
      - run: node tests/test_trip.js
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_app.py
      - run: python scripts/package.py
      - run: python scripts/release_check.py
      - run: python -m pip install splunk-appinspect==4.4.0
      - run: python scripts/run_appinspect.py
